services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bloodconnect
      POSTGRES_PASSWORD: bloodconnect_dev
      POSTGRES_DB: bloodconnect
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodconnect -d bloodconnect"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
